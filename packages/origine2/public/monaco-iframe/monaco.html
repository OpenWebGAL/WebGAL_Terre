<!DOCTYPE html>
<html>
<head>
  <title>Monaco Editor in iframe</title>
  <style>
    html, body, #container {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
<div id="container"></div>

<script>
  var require = {paths: {'vs': '/monaco-iframe/min/vs'}};
</script>
<script src="/monaco-iframe/loader.js"></script>
<script>
  require(['vs/editor/editor.main'], function () {
    var editor = monaco.editor.create(document.getElementById('container'), {
      value: '',
      language: 'js',  // 初始化语言为 javascript，可以根据需要修改
      automaticLayout: true,
      wordWrap: 'on',
    });

    // 载入远端内容期间抑制 valueChanged，避免「打开文件即触发一次保存」
    var applyingRemoteValue = false;

    // 通知父窗口 editor 已经准备好
    window.parent.postMessage({type: 'editorReady'}, '*');

    // 监听来自父窗口的消息
    window.addEventListener('message', function (event) {
      // 安全检查，确保消息来自你的预期来源
      // if (event.origin !== 'your_parent_origin') return;

      var message = event.data;

      switch (message.type) {
        case 'setLanguage':
          monaco.editor.setModelLanguage(editor.getModel(), message.language);
          break;
        case 'setValue':
          // 只在内容确实不同时写入
          if (editor.getValue() !== message.value) {
            // 必须用 setValue，不能用 executeEdits：
            // executeEdits 会把「载入文件内容」记录成一次可撤销的编辑，
            // 用户不输入任何字符直接按 Ctrl+Z 就会撤回成空内容，
            // 之后 valueChanged 把空内容回传，文件就会被写成 0 字节。
            // setValue 会重置撤销栈，因此载入后不存在可撤销的历史。
            applyingRemoteValue = true;
            try {
              editor.setValue(message.value);
            } finally {
              applyingRemoteValue = false;
            }
          }
          break;
        case 'setTheme':
          monaco.editor.setTheme(message.theme);
          break;
      }
    });

    // 监听编辑器内容变化
    editor.onDidChangeModelContent(function () {
      // 载入远端内容引起的变更不向上回传
      if (applyingRemoteValue) return;
      // 向父窗口发送消息
      window.parent.postMessage({
        type: 'valueChanged',
        value: editor.getValue()
      }, '*'); // 可以替换 '*' 为你的父窗口 origin
    });
  });
</script>
</body>
</html>
